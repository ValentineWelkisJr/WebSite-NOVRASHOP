    - name: Enviar señal de actualización a DuckDNS
      env:
        DOMAIN: ${{ secrets.DUCKDNS_DOMAIN }}
        TOKEN: ${{ secrets.DUCKDNS_TOKEN }}
      run: |
        # Eliminamos posibles espacios en blanco o saltos de línea accidentales
        CLEAN_DOMAIN=$(echo "$DOMAIN" | tr -d '[:space:]')
        CLEAN_TOKEN=$(echo "$TOKEN" | tr -d '[:space:]')
        
        # Ejecutamos el curl con la URL limpia y entre comillas simples
        curl -s "https://duckdns.org{CLEAN_DOMAIN}&token=${CLEAN_TOKEN}"
